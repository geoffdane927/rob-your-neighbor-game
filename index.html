<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rob Your Neighbor</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif}#hud{position:fixed;left:16px;top:16px;color:white;background:#0009;padding:12px 14px;border-radius:10px;z-index:5;line-height:1.45;user-select:none}#status{font-weight:700}#cross{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px;z-index:4;color:white;font-size:18px}#help{position:fixed;right:16px;bottom:16px;color:#ddd;background:#0009;padding:10px;border-radius:8px;z-index:5;text-align:right;font-size:13px}#gameover{display:none;position:fixed;inset:0;z-index:20;background:#000b;color:white;align-items:center;justify-content:center;text-align:center;font-size:28px}.bar{width:220px;height:12px;background:#333;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#e8a33a}</style>
</head>
<body>
<div id="hud"><div id="status">Steal furniture and get home.</div><div>Stolen: <span id="stolen">0</span>/<span id="total">0</span></div><div>Neighbor worry</div><div class="bar"><div id="worry" class="fill"></div></div></div>
<div id="cross">+</div>
<div id="help">WASD move · Shift sprint · Mouse look<br>E pick up/drop · F open/close door<br>Esc releases mouse</div>
<div id="gameover"><div><h1>Caught!</h1><p>The neighbor found you.</p><p style="font-size:16px">Refresh to try again.</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/PointerLockControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9eb7c9);scene.fog=new THREE.Fog(0x9eb7c9,35,90);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,150);camera.position.set(0,1.65,17);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const controls=new THREE.PointerLockControls(camera,document.body);scene.add(controls.getObject());
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-12,0)});world.broadphase=new CANNON.SAPBroadphase(world);world.allowSleep=true;
const mats={wall:new THREE.MeshStandardMaterial({color:0xd8c8aa}),floor:new THREE.MeshStandardMaterial({color:0x665443}),wood:new THREE.MeshStandardMaterial({color:0x71452b}),white:new THREE.MeshStandardMaterial({color:0xe9e1d2}),red:new THREE.MeshStandardMaterial({color:0x9d3e32}),green:new THREE.MeshStandardMaterial({color:0x4c7352})};
scene.add(new THREE.HemisphereLight(0xdcecff,0x33291f,2.0));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-10,18,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
function boxMesh(x,y,z,sx,sy,sz,mat,physical=true){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);if(physical){const b=new CANNON.Body({mass:0,shape:new CANNON.Box(new CANNON.Vec3(sx/2,sy/2,sz/2)),position:new CANNON.Vec3(x,y,z)});world.addBody(b);m.userData.body=b}return m}
// Ground and house walls
boxMesh(0,-.25,0,46,.5,40,mats.floor);boxMesh(-23,4,0,.5,8,40,mats.wall);boxMesh(23,4,0,.5,8,40,mats.wall);boxMesh(0,4,-20,46,8,.5,mats.wall);boxMesh(0,4,20,46,8,.5,mats.wall);
// Interior layout
boxMesh(-7,2.5,0,.4,5,19,mats.wall);boxMesh(7,2.5,-7,.4,5,9,mats.wall);boxMesh(7,2.5,8,.4,5,8,mats.wall);
// front porch / player safe zone
boxMesh(0,2.5,11,12,5,.35,mats.wall);
// Doors are dynamic visual objects with simple hinge-like rotation.
const doors=[];
function makeDoor(x,z,rot=0){const d=new THREE.Mesh(new THREE.BoxGeometry(2.6,4,.18),mats.wood);d.position.set(x,2,z);d.rotation.y=rot;d.castShadow=d.receiveShadow=true;scene.add(d);d.userData.open=false;d.userData.baseRot=rot;d.userData.soundCooldown=0;doors.push(d);return d}
makeDoor(0,11,0);makeDoor(-7,5,Math.PI/2);makeDoor(7,-2,Math.PI/2);
// Furniture: all are real cannon bodies and can be carried.
const furniture=[];
function furnitureItem(name,x,y,z,sx,sy,sz,mat){const m=boxMesh(x,y,z,sx,sy,sz,mat,false);const body=new CANNON.Body({mass:Math.max(1,sx*sy*sz),shape:new CANNON.Box(new CANNON.Vec3(sx/2,sy/2,sz/2)),position:new CANNON.Vec3(x,y,z),linearDamping:.25,angularDamping:.55});body.allowSleep=true;world.addBody(body);m.userData={body,name,stolen:false,carried:false,home:false,original:new CANNON.Vec3(x,y,z)};furniture.push(m);return m}
furnitureItem('chair',-14,.9,-9,1.2,1.8,1.2,mats.red);furnitureItem('lamp',-12,1.3,-4,.65,2.6,.65,mats.white);furnitureItem('table',-15,1.5,5,3,3,1.8,mats.wood);furnitureItem('chair',-12,.9,7,1.2,1.8,1.2,mats.green);furnitureItem('cabinet',12,2,-11,2.8,4,1.2,mats.wood);furnitureItem('sofa',14,1.5,-4,4,2.2,1.5,mats.red);furnitureItem('chair',13,.9,5,1.2,1.8,1.2,mats.green);
document.getElementById('total').textContent=furniture.length;
// Player body: camera remains free, movement is collision-aware only against walls via simple bounds/segment tests.
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')interact();if(e.code==='KeyF')doorInteract();});addEventListener('keyup',e=>keys[e.code]=false);
document.body.addEventListener('click',()=>{if(!controls.isLocked)controls.lock()});
let velocity=new THREE.Vector3(),stolen=0,worry=0,lastPos=new THREE.Vector3(),noisePulse=0,gameEnded=false,carried=null;
function playerPos(){return controls.getObject().position}
function distXZ(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}
function emitNoise(amount,pos){noisePulse=Math.max(noisePulse,amount);neighbor.hear(pos,amount)}
function interact(){if(gameEnded)return;const p=playerPos();if(carried){dropFurniture();return}let best=null,bd=2.4;for(const f of furniture){if(f.userData.carried||f.userData.home)continue;const d=distXZ(p,f.position);if(d<bd){bd=d;best=f}}if(best){carried=best;best.userData.carried=true;best.userData.body.type=CANNON.Body.KINEMATIC;best.userData.body.mass=0;emitNoise(2,p)}}
function dropFurniture(){const f=carried;carried=null;f.userData.carried=false;const b=f.userData.body;b.type=CANNON.Body.DYNAMIC;b.mass=Math.max(1,f.scale.x*f.scale.y*f.scale.z*2);b.updateMassProperties();b.position.set(playerPos().x,Math.max(1,f.geometry.parameters.height/2),playerPos().z-1.3);b.velocity.set(0,0,0);emitNoise(18,b.position)}
function doorInteract(){const p=playerPos();let best=null,bd=3;for(const d of doors){const dd=distXZ(p,d.position);if(dd<bd){bd=dd;best=d}}if(best){best.userData.open=!best.userData.open;emitNoise(12,best.position)}}
// Neighbor AI
const neighbor={mesh:null,body:null,state:'prowl',target:null,knownPos:null,worry:0,hear(pos,amount){const d=distXZ(pos,this.mesh.position);let effective=amount/(1+d*.06);if(effective>1)this.worry=Math.min(100,this.worry+effective*2);this.lastNoise=pos.clone();if(this.worry>=100){this.knownPos=pos.clone();this.state='chase'}},lastNoise:null,path:[],pathIndex:0};
const nm=new THREE.Mesh(new THREE.CapsuleGeometry(.65,1.7,5,10),new THREE.MeshStandardMaterial({color:0x30384b}));nm.position.set(13,1.65,11);nm.castShadow=true;scene.add(nm);neighbor.mesh=nm;
// Navigation nodes form a simple hand-authored house graph. The AI uses A* and dynamically recomputes when chasing.
const nodes=[[-15,12],[0,12],[14,12],[-15,3],[-2,3],[14,3],[-15,-7],[-2,-7],[14,-7],[-15,-15],[0,-15],[14,-15]];
const edges=[[0,1],[1,2],[0,3],[1,4],[2,5],[3,4],[4,5],[3,6],[4,7],[5,8],[6,7],[7,8],[6,9],[7,10],[8,11],[9,10],[10,11]];
function nearestNode(v){let bi=0,bd=1e9;nodes.forEach((n,i)=>{const d=(n[0]-v.x)**2+(n[1]-v.z)**2;if(d<bd){bd=d;bi=i}});return bi}
function astar(start,end){const open=[start],came={},g={[start]:0},f={[start]:0};while(open.length){open.sort((a,b)=>(f[a]??1e9)-(f[b]??1e9));const cur=open.shift();if(cur===end){const path=[cur];let c=cur;while(came[c]!==undefined){c=came[c];path.unshift(c)}return path}for(const e of edges){if(e[0]!==cur&&e[1]!==cur)continue;const nb=e[0]===cur?e[1]:e[0];const ng=g[cur]+Math.hypot(nodes[cur][0]-nodes[nb][0],nodes[cur][1]-nodes[nb][1]);if(ng<(g[nb]??1e9)){came[nb]=cur;g[nb]=ng;f[nb]=ng+Math.hypot(nodes[nb][0]-nodes[end][0],nodes[nb][1]-nodes[end][1]);if(!open.includes(nb))open.push(nb)}}}return[end]}
let prowlTimer=0;function updateNeighbor(dt){if(gameEnded)return;const p=playerPos();const n=neighbor.mesh;const d=distXZ(p,n.position);if(d<2.0&&Math.abs(p.y-n.position.y)<2){endGame();return}
if(neighbor.state==='chase'){neighbor.path=astar(nearestNode(n.position),nearestNode(neighbor.knownPos||p));neighbor.pathIndex=0;const target=neighbor.knownPos||p;moveNPC(target,dt,5.3);if(distXZ(n,target)<1.8){neighbor.state='search';neighbor.worry=70;neighbor.knownPos=null}}
else if(neighbor.state==='search'){prowlTimer-=dt;if(prowlTimer<=0){neighbor.state='prowl';prowlTimer=4}}
else{prowlTimer-=dt;if(prowlTimer<=0||!neighbor.target){neighbor.target=nodes[Math.floor(Math.random()*nodes.length)];prowlTimer=4+Math.random()*5}moveNPC({x:neighbor.target[0],z:neighbor.target[1]},dt,1.7);if(distXZ(n,{x:neighbor.target[0],z:neighbor.target[1]})<1.2)prowlTimer=0}
// Missing furniture increases suspicion slowly.
const missing=furniture.filter(f=>f.userData.stolen&&!f.userData.home).length;neighbor.worry=Math.min(100,neighbor.worry+missing*.006*dt);if(neighbor.worry>=100&&neighbor.state!=='chase'){neighbor.knownPos=p.clone();neighbor.state='chase'}document.getElementById('worry').style.width=neighbor.worry+'%';}
function moveNPC(target,dt,speed){const n=neighbor.mesh;const dx=target.x-n.position.x,dz=target.z-n.position.z;const l=Math.hypot(dx,dz);if(l>.2){n.position.x+=dx/l*speed*dt;n.position.z+=dz/l*speed*dt;n.rotation.y=Math.atan2(dx,dz)}}
function endGame(){gameEnded=true;document.getElementById('gameover').style.display='flex';controls.unlock()}
function updateFurniture(){for(const f of furniture){const b=f.userData.body;if(f.userData.carried){const p=playerPos();const forward=new THREE.Vector3();camera.getWorldDirection(forward);const target=p.clone().add(forward.multiplyScalar(1.6));b.position.set(target.x,Math.max(1,target.y-.2),target.z);b.velocity.set(0,0,0);b.angularVelocity.set(0,0,0)}f.position.copy(b.position);f.quaternion.copy(b.quaternion);}}
function updatePlayer(dt){if(gameEnded)return;const p=playerPos();let forward=(keys.KeyW?1:0)-(keys.KeyS?1:0),side=(keys.KeyD?1:0)-(keys.KeyA?1:0);const sprint=keys.ShiftLeft||keys.ShiftRight;const speed=sprint?7:3.8;const v=new THREE.Vector3(side,0,-forward);if(v.lengthSq()>0){v.normalize().applyQuaternion(camera.quaternion);v.y=0;v.normalize();p.x+=v.x*speed*dt;p.z+=v.z*speed*dt;if(sprint)emitNoise(4,p)}p.x=Math.max(-21.5,Math.min(21.5,p.x));p.z=Math.max(-18.5,Math.min(18.5,p.z));p.y=1.65;const movement=distXZ(p,lastPos);if(movement>.01&&!sprint)noisePulse=Math.max(0,noisePulse-dt*3);lastPos.copy(p);if(sprint&&movement>.02)neighbor.hear(p,1.5)}
function checkDelivery(){if(!carried)return;const p=playerPos();if(p.z>12&&Math.abs(p.x)<6){const f=carried;carried=null;f.userData.carried=false;f.userData.stolen=true;f.userData.home=true;f.userData.body.type=CANNON.Body.KINEMATIC;f.position.set(-30,2+stolen*.8,12);stolen++;document.getElementById('stolen').textContent=stolen;neighbor.worry=Math.min(100,neighbor.worry+12);if(stolen===furniture.length){document.getElementById('status').textContent='You robbed the house! You win!';setTimeout(()=>controls.unlock(),500)}}}
let clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(.033,clock.getDelta());updatePlayer(dt);world.step(1/60,dt,3);updateFurniture();updateNeighbor(dt);checkDelivery();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
